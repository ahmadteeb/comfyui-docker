
name: comfyui

services:
  nvidia:
    image: ghcr.io/kagurazakanyaa/comfyui:cu130-latest
    container_name: comfyui-nvidia
    profiles: ["nvidia"]
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./data:/data
    ipc: host
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188"]
    networks:
      comfyui:
        ipv4_address: 172.30.10.2

  amd:
    image: ghcr.io/kagurazakanyaa/comfyui:rocm-latest
    container_name: comfyui-amd
    profiles: ["amd"]
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp:unconfined
    ipc: host
    volumes:
      - ./data:/data
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188"]
    networks:
      comfyui:
        ipv4_address: 172.30.10.2

  cpu:
    image: ghcr.io/kagurazakanyaa/comfyui:cpu-latest
    container_name: comfyui-cpu
    profiles: ["cpu"]
    restart: unless-stopped
    volumes:
      - ./data:/data
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188"]
    networks:
      comfyui:
        ipv4_address: 172.30.10.2

networks:
  comfyui:
    name: comfyui
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/30
          gateway: 172.30.10.1
